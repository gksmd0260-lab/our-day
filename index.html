function initSupabase(){
  const validUrl=CONFIG.SUPABASE_URL && CONFIG.SUPABASE_URL.startsWith("https://") && !CONFIG.SUPABASE_URL.includes("여기에_");
  const validKey=CONFIG.SUPABASE_ANON_KEY && !CONFIG.SUPABASE_ANON_KEY.includes("여기에_");

    try{ sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY); }catch(e){ sb=null; }

}

function updateCoupleDays(){
  const now=new Date();
  const start=new Date(CONFIG.START_DATE);
  const koreaNow=new Date(now.toLocaleString("en-US",{timeZone:"Asia/Seoul"}));
  const koreaStart=new Date(start.toLocaleString("en-US",{timeZone:"Asia/Seoul"}));
  const n=new Date(koreaNow.getFullYear(),koreaNow.getMonth(),koreaNow.getDate());
  const s=new Date(koreaStart.getFullYear(),koreaStart.getMonth(),koreaStart.getDate());
  const days=Math.floor((n-s)/86400000)+1;
  const el=document.getElementById("coupleDays");
  if(el) el.textContent=`${Math.max(1,days)}일`;
}

moods.forEach(m=>{const b=document.createElement("button");b.className="pill";b.textContent=m;b.onclick=()=>saveMood(m);moodBtns.appendChild(b)});
async function saveAnswer(){const a=answer.value.trim();if(!a)return;await sb.from("daily_answers").upsert({day:key(),person:currentUser,answer:a},{onConflict:"day,person"});refreshAll()}
async function loadAnswers(){const {data=[]}=await sb.from("daily_answers").select("*").eq("day",key());const me=data.find(x=>x.person===currentUser),ot=data.find(x=>x.person!==currentUser);if(me)answer.value=me.answer;answers.innerHTML=`<div class="person"><b>${currentUser}</b>${me?me.answer:"아직 답하지 않았어."}</div><div class="person"><b>${currentUser==="하능"?"지은":"하능"}</b>${me&&ot?ot.answer:"둘 다 답하면 공개돼 👀"}</div>`}
async function saveMood(mood){await sb.from("daily_moods").upsert({day:key(),person:currentUser,mood},{onConflict:"day,person"});refreshAll()}async function loadMoods(){const {data=[]}=await sb.from("daily_moods").select("*").eq("day",key());moodShared.textContent=data.map(x=>`${x.person}: ${x.mood}`).join(" · ")||"아직 등록된 기분이 없어."}
async function uploadPhoto(){const f=photoInput.files[0];if(!f)return;const ext=f.name.split(".").pop()||"jpg",path=`${key()}/${currentUser}.${ext}`;const {error}=await sb.storage.from("couple-photos").upload(path,f,{upsert:true,contentType:f.type});if(error){photoStatus.textContent=error.message;return}const {data}=sb.storage.from("couple-photos").getPublicUrl(path);await sb.from("daily_photos").upsert({day:key(),person:currentUser,url:data.publicUrl},{onConflict:"day,person"});photoStatus.textContent="사진 업로드 완료 ✓";refreshAll()}async function loadPhotos(){const {data=[]}=await sb.from("daily_photos").select("*").eq("day",key());photos.innerHTML=data.map(x=>`<div style="width:calc(50% - 4px)"><div class="photo"><img src="${x.url}?t=${Date.now()}"></div><div class="status">${x.person}</div></div>`).join("")||'<div class="status">아직 오늘 사진이 없어.</div>'}
async function completeMission(){await sb.from("daily_missions").upsert({day:key(),person:currentUser,done:true},{onConflict:"day,person"});refreshAll()}async function loadMission(){const {data=[]}=await sb.from("daily_missions").select("*").eq("day",key());missionStatus.textContent=data.map(x=>`${x.person} 완료 ✓`).join(" · ")||"아직 완료한 사람이 없어."}
async function loadStats(){const rs=await Promise.all(["daily_answers","daily_moods","daily_photos","daily_missions"].map(t=>sb.from(t).select("day,person")));const map={};rs.flatMap(r=>r.data||[]).forEach(x=>{map[x.day]??=new Set();map[x.day].add(x.person)});const both=Object.keys(map).filter(d=>map[d].size>=2).sort();total.textContent=`${both.length}일`;let s=0,c=new Date(key()+"T00:00:00+09:00");while(map[key(c)]?.size>=2){s++;c=new Date(c.getTime()-86400000)}streak.textContent=`${s}일`}async function refreshAll(){await Promise.all([loadAnswers(),loadMoods(),loadPhotos(),loadMission(),loadStats()])}
function showTab(t){
  homeView.style.display=t==="home"?"block":"none";
  todayView.style.display=t==="today"?"block":"none";
  archiveView.style.display=t==="archive"?"block":"none";
  tabHome.classList.toggle("active",t==="home");
  tabToday.classList.toggle("active",t==="today");
  tabArchive.classList.toggle("active",t==="archive");
  hero.style.display=t==="home"?"block":"none";
  stats.style.display=t==="home"?"flex":"none";
  updateCoupleDays();
  if(t==="archive") renderCalendar();
  window.scrollTo({top:0,behavior:"smooth"});
}
let calDate=new Date();calDate=new Date(calDate.getFullYear(),calDate.getMonth(),1);function moveMonth(n){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1);renderCalendar()}
async function renderCalendar(){monthLabel.textContent=new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"long"}).format(calDate);calendar.innerHTML="";const y=calDate.getFullYear(),m=calDate.getMonth(),st=new Date(y,m,1),en=new Date(y,m+1,0),from=key(st),to=key(en);const rs=await Promise.all(["daily_answers","daily_moods","daily_photos","daily_missions"].map(t=>sb.from(t).select("day").gte("day",from).lte("day",to)));const has=new Set(rs.flatMap(r=>(r.data||[]).map(x=>x.day)));for(let i=0;i<st.getDay();i++){const e=document.createElement("div");e.className="day empty";calendar.appendChild(e)}for(let d=1;d<=en.getDate();d++){const ds=key(new Date(y,m,d)),b=document.createElement("button");b.className="day"+(has.has(ds)?" has":"")+(ds===key()?" today":"");b.textContent=d;if(has.has(ds)){const dot=document.createElement("span");dot.className="dot";b.appendChild(dot)}b.onclick=()=>loadArchive(ds);calendar.appendChild(b)}archiveDetail.innerHTML='<div class="status">날짜를 누르면 그날 기록을 볼 수 있어.</div>'}
async function loadArchive(ds){archiveDetail.innerHTML='<div class="status">불러오는 중...</div>';const [a,m,p,mi]=await Promise.all([sb.from("daily_answers").select("*").eq("day",ds),sb.from("daily_moods").select("*").eq("day",ds),sb.from("daily_photos").select("*").eq("day",ds),sb.from("daily_missions").select("*").eq("day",ds)]);let h=`<b>${ds} · 질문 ${qIndex(ds)+1}/365</b><div class="question" style="font-size:16px;margin-top:8px">${QUESTIONS[qIndex(ds)]}</div>`;h+=(a.data||[]).map(x=>`<div class="person"><b>${x.person}</b>${x.answer}</div>`).join("")||'<div class="status">답변 기록 없음</div>';if((m.data||[]).length)h+=`<div class="person"><b>기분</b>${m.data.map(x=>`${x.person}: ${x.mood}`).join(" · ")}</div>`;if((p.data||[]).length)h+=`<div class="row" style="margin-top:10px">${p.data.map(x=>`<div style="width:calc(50% - 4px)"><div class="photo"><img src="${x.url}"></div><div class="status">${x.person}</div></div>`).join("")}</div>`;if((mi.data||[]).length)h+=`<div class="person"><b>미션</b>${mi.data.map(x=>`${x.person} 완료 ✓`).join(" · ")}</div>`;archiveDetail.innerHTML=h}
function changeUser(){
  localStorage.removeItem("ourday-user");
  currentUser="";
  app.style.display="none";
  stats.style.display="none";
  hero.style.display="block";
  loginCard.style.display="block";
  pin.value="";
  loginStatus.textContent="";
  window.scrollTo({top:0,behavior:"smooth"});
}
if(currentUser && sb){
  who.value=currentUser;
  loginCard.style.display="none";
  app.style.display="block";
  showTab("home");
  refreshAll();
}

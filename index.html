<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fff7f8" />
  <title>OUR DAY</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#fff7f8; --card:#fff; --text:#2b2527; --sub:#7d7276;
      --accent:#ef6f8f; --line:#f0dfe4; --shadow:0 12px 30px rgba(90,40,55,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#fff7f8 0%,#fff 72%);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text)}
    .wrap{max-width:560px;margin:auto;padding:18px 16px calc(26px + env(safe-area-inset-bottom))}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .brand{font-weight:850;letter-spacing:.5px}.muted{color:var(--sub);font-size:12px}
    .hero{background:linear-gradient(135deg,#ed698a,#f3a6bb);color:#fff;border-radius:28px;padding:24px;box-shadow:var(--shadow)}
    .hero h1{font-size:34px;margin:6px 0}.clocks{display:flex;gap:10px;margin-top:16px}.clock{flex:1;background:rgba(255,255,255,.17);border-radius:18px;padding:12px}.clock b{display:block;margin-top:4px;font-size:18px}
    .card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;margin-top:12px;box-shadow:var(--shadow)}
    .card h2{margin:0 0 12px;font-size:16px}.question{font-weight:800;font-size:20px;line-height:1.45;margin-bottom:12px}
    textarea,input,select,button{font:inherit} textarea,input,select{width:100%;border:1px solid var(--line);border-radius:15px;background:#fffafa;padding:12px}
    textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:15px;padding:11px 14px;font-weight:750;background:var(--accent);color:white;cursor:pointer}.btn.alt{background:#fff0f4;color:#a94963}
    .row{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 12px;cursor:pointer}.pill.active{background:#ffe6ed;color:#a33f5b;font-weight:800}
    .person{padding:12px;border-radius:16px;background:#fff8fa;margin-top:8px}.person b{display:block;margin-bottom:5px}.hidden-answer{color:var(--sub);font-style:italic}
    .photo{width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#fff7f8;border:1px dashed #e7cbd3;display:flex;align-items:center;justify-content:center;color:var(--sub)}
    .photo img{width:100%;height:100%;object-fit:cover}.status{font-size:13px;color:var(--sub);margin-top:9px}
    .login{display:grid;gap:8px}.footer{text-align:center;color:var(--sub);font-size:12px;padding:18px 0 4px}
  </style>
</head>
<body>
<main class="wrap">
  <div class="top"><div><div class="brand">OUR DAY</div><div class="muted">하능 ♥ 지은</div></div><div class="muted" id="today"></div></div>

  <section class="hero">
    <div>지지은 한국복귀까지</div>
    <h1 id="dday">D-?</h1>
    <div id="remain"></div>
    <div class="clocks">
      <div class="clock">🇰🇷 한국<b id="kr">--:--</b></div>
      <div class="clock">🇧🇪 벨기에<b id="be">--:--</b></div>
    </div>
  </section>

  <section class="card" id="loginCard">
    <h2>🔐 우리 둘만 입장</h2>
    <div class="login">
      <select id="who">
        <option value="하능">하능</option>
        <option value="지은">지은</option>
      </select>
      <input id="pin" type="password" inputmode="numeric" placeholder="둘만 아는 PIN" />
      <button class="btn" onclick="enterApp()">입장</button>
    </div>
    <div class="status" id="loginStatus"></div>
  </section>

  <div id="app" style="display:none">
    <section class="card">
      <h2>💌 오늘의 질문</h2>
      <div class="question" id="question"></div>
      <textarea id="answer" placeholder="내 답을 남겨봐"></textarea>
      <div class="row" style="margin-top:9px"><button class="btn" onclick="saveAnswer()">답 저장</button></div>
      <div id="answers"></div>
    </section>

    <section class="card">
      <h2>🙂 지금 기분</h2>
      <div class="row" id="moods"></div>
      <div id="moodShared" class="status"></div>
    </section>

    <section class="card">
      <h2>📷 오늘 한 장</h2>
      <input id="photoInput" type="file" accept="image/*" />
      <button class="btn" style="margin-top:8px" onclick="uploadPhoto()">사진 올리기</button>
      <div class="row" id="photos" style="margin-top:12px"></div>
      <div class="status" id="photoStatus"></div>
    </section>

    <section class="card">
      <h2>🎲 오늘의 미션</h2>
      <div class="question" id="mission"></div>
      <div class="row"><button class="btn" onclick="completeMission()">완료</button></div>
      <div class="status" id="missionStatus"></div>
    </section>
  </div>

  <div class="footer">둘만의 하루를 조금씩 쌓아가는 앱</div>
</main>

<script>
const CONFIG = {
  SUPABASE_URL: "https://teaflrcofomajypzjxjp.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_d3S_9UYDu_MMk449846paQ_zoLRWNuQ",
  COUPLE_PIN: "0525",
  RETURN_DATE: "2027-01-15T18:00:00+09:00"
};

const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
let currentUser = localStorage.getItem("ourday-user") || "";

const questions = [
 "내가 처음 설레게 했던 순간은 언제였어?","우리 둘이 꼭 같이 가보고 싶은 곳은?","요즘 내가 해주면 가장 좋을 것 같은 건?",
 "우리 사이에서 제일 기억에 남는 하루는?","나랑 같이 해보고 싶은 소소한 일 하나는?","1년 뒤 우리 둘은 뭘 하고 있을 것 같아?"
];
const missions = [
 "서로 음성메시지 하나 보내기","오늘 찍은 사진 한 장 서로 보내기","상대방 칭찬 3개 말해주기",
 "다음 데이트 메뉴를 한 명이 몰래 정하기","예전에 찍은 사진 한 장 골라서 보내기","서로 보고 싶은 이유를 한 문장으로 말하기"
];
const moods = ["좋아 🙂","행복해 🥰","피곤해 😴","보고싶어 🥺","심심해 😶","힘들어 😔"];
const key = ()=> new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Seoul"});
const pick = (arr,salt)=>{
  let s=key()+salt,h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return arr[h%arr.length];
};

function clocks(){
 const now=new Date(), target=new Date(CONFIG.RETURN_DATE), diff=target-now;
 document.getElementById("kr").textContent=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",hour:"2-digit",minute:"2-digit",hour12:false}).format(now);
 document.getElementById("be").textContent=new Intl.DateTimeFormat("ko-KR",{timeZone:"Europe/Brussels",hour:"2-digit",minute:"2-digit",hour12:false}).format(now);
 const m=Math.max(0,Math.floor(diff/60000)),d=Math.floor(m/1440),h=Math.floor((m%1440)/60),mi=m%60;
 document.getElementById("dday").textContent=diff>0?`D-${d}`:"D-DAY";
 document.getElementById("remain").textContent=diff>0?`${d}일 ${h}시간 ${mi}분 남음`:"드디어 오늘!";
}
document.getElementById("today").textContent=new Intl.DateTimeFormat("ko-KR",{month:"long",day:"numeric",weekday:"short"}).format(new Date());
document.getElementById("question").textContent=pick(questions,"q");
document.getElementById("mission").textContent=pick(missions,"m");
clocks(); setInterval(clocks,30000);

async function enterApp(){
 if(document.getElementById("pin").value !== CONFIG.COUPLE_PIN){
   document.getElementById("loginStatus").textContent="PIN이 맞지 않아."; return;
 }
 currentUser=document.getElementById("who").value;
 localStorage.setItem("ourday-user",currentUser);
 document.getElementById("loginCard").style.display="none";
 document.getElementById("app").style.display="block";
 await refreshAll();
}

function renderMoods(){
 const wrap=document.getElementById("moods"); wrap.innerHTML="";
 moods.forEach(m=>{
   const b=document.createElement("button"); b.className="pill"; b.textContent=m;
   b.onclick=()=>saveMood(m); wrap.appendChild(b);
 });
}
renderMoods();

async function saveAnswer(){
 const answer=document.getElementById("answer").value.trim(); if(!answer)return;
 await sb.from("daily_answers").upsert({day:key(),person:currentUser,answer},{onConflict:"day,person"});
 await loadAnswers();
}
async function loadAnswers(){
 const {data=[]}=await sb.from("daily_answers").select("*").eq("day",key());
 const mine=data.find(x=>x.person===currentUser), other=data.find(x=>x.person!==currentUser);
 if(mine) document.getElementById("answer").value=mine.answer;
 const both=mine && other;
 document.getElementById("answers").innerHTML=
   `<div class="person"><b>${currentUser}</b>${mine?mine.answer:"아직 답하지 않았어."}</div>`+
   `<div class="person"><b>${currentUser==="하능"?"지은":"하능"}</b>${both?other.answer:'<span class="hidden-answer">둘 다 답하면 공개돼 👀</span>'}</div>`;
}
async function saveMood(mood){
 await sb.from("daily_moods").upsert({day:key(),person:currentUser,mood},{onConflict:"day,person"});
 await loadMoods();
}
async function loadMoods(){
 const {data=[]}=await sb.from("daily_moods").select("*").eq("day",key());
 document.getElementById("moodShared").textContent=data.map(x=>`${x.person}: ${x.mood}`).join(" · ") || "아직 등록된 기분이 없어.";
}
async function uploadPhoto(){
 const file=document.getElementById("photoInput").files[0]; if(!file)return;
 const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
 const path=`${key()}/${currentUser}.${ext}`;
 const {error}=await sb.storage.from("couple-photos").upload(path,file,{upsert:true,contentType:file.type});
 if(error){document.getElementById("photoStatus").textContent=error.message;return;}
 const {data}=sb.storage.from("couple-photos").getPublicUrl(path);
 await sb.from("daily_photos").upsert({day:key(),person:currentUser,url:data.publicUrl},{onConflict:"day,person"});
 document.getElementById("photoStatus").textContent="사진 업로드 완료 ✓";
 await loadPhotos();
}
async function loadPhotos(){
 const {data=[]}=await sb.from("daily_photos").select("*").eq("day",key());
 document.getElementById("photos").innerHTML=data.map(x=>`<div style="width:calc(50% - 4px)"><div class="photo"><img src="${x.url}?t=${Date.now()}"></div><div class="status">${x.person}</div></div>`).join("") || '<div class="status">아직 오늘 사진이 없어.</div>';
}
async function completeMission(){
 await sb.from("daily_missions").upsert({day:key(),person:currentUser,done:true},{onConflict:"day,person"});
 await loadMission();
}
async function loadMission(){
 const {data=[]}=await sb.from("daily_missions").select("*").eq("day",key());
 document.getElementById("missionStatus").textContent=data.map(x=>`${x.person} 완료 ✓`).join(" · ") || "아직 완료한 사람이 없어.";
}
async function refreshAll(){
 await Promise.all([loadAnswers(),loadMoods(),loadPhotos(),loadMission()]);
}
if(currentUser){
 document.getElementById("who").value=currentUser;
 document.getElementById("loginCard").style.display="none";
 document.getElementById("app").style.display="block";
 refreshAll();
}
</script>
</body>
</html>
